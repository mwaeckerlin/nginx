server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  error_log /proc/1/fd/2 info;
  # error handling
  error_page 500 /502.html;
  error_page 502 /502.html;
  error_page 504 /504.html;
  error_page 404 /404.html;
  error_page 403 /404.html;
  location ~ ^/(502|504|404)\.html {
    internal;
    root /etc/nginx/error/$lang;
  }
  location ~ ^/(502|504|404)\.jpg {
    root /etc/nginx/error;
  }

  # Security headers — the complete set lives here (server level): nginx
  # add_header inheritance is all-or-nothing, so nothing can be inherited
  # from http level once a server block sets its own headers.
  # Pinned by tests/e2e/test_headers.py.
  add_header X-Content-Type-Options            "nosniff"           always;
  # "0": the legacy XSS auditor is deprecated and abusable for cross-site
  # leaks — explicitly off per OWASP guidance
  add_header X-XSS-Protection                  "0"                 always;
  add_header X-Frame-Options                   "SAMEORIGIN"        always;
  add_header X-Robots-Tag                      "noindex, nofollow" always;
  add_header X-Download-Options                "noopen"            always;
  add_header X-Permitted-Cross-Domain-Policies "none"              always;
  add_header Referrer-Policy                   "no-referrer"       always;

  # serve files
  index index.$lang.php index.$lang.html index.php index.html /index.php;
  # flexibility
  include /etc/nginx/locations.d/default.conf;
}