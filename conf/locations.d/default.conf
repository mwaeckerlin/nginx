  # serve php
  location ~* \.php(?:$|/) {
    root ${ROOT};
    include         fastcgi_params;
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    set $path_info $fastcgi_path_info;
    try_files  $fastcgi_script_name $uri.$lang $uri.$lang.php $uri.$lang.html $uri $uri.php $uri.html $uri.$lang/ $uri/ =404;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_param PATH_INFO       $path_info;
    fastcgi_param HTTPS           $fastcgi_https if_not_empty;
    resolver        127.0.0.11:53 valid=30s;
    fastcgi_pass    ${PHP_FPM_HOST}:${PHP_FPM_PORT};
    fastcgi_intercept_errors off;
    fastcgi_request_buffering off;
 }

  # Static assets with long cache: a missing asset must return 404, never the
  # app shell or the PHP front controller (otherwise broken SPA builds stay hidden).
  location ~ \.(?:css|js|mjs|map|svg|gif|png|jpg|ico|otf|woff2?)$ {
    root ${ROOT};
    try_files $uri =404;
    expires 6M;
    access_log off;
  }

  # Universal handling for static files, SPA/PWA, PHP and *.XX.* language variants.
  # try_files checks every entry but the last as a file on disk; only the last is a
  # fallback URI. By probing the language and plain HTML app shell before the PHP
  # front controller, the mere presence of a file decides the mode without any extra
  # configuration: an existing index.html serves the SPA shell (php-fpm never needed),
  # otherwise the request falls through to /index.php (php-fpm front controller).
  location / {
    root ${ROOT};
    try_files $uri.$lang.html $uri.html $uri $uri.$lang/ $uri/ /index.$lang.html /index.html /index.php$is_args$args;
  }
