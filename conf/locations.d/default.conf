  # serve php
  location ~* \.php(?:$|/) {
    root ${ROOT};
    include         fastcgi_params;
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    set $path_info $fastcgi_path_info;
    try_files  $fastcgi_script_name $uri.$lang $uri.$lang.php $uri.$lang.html $uri $uri.php $uri.html $uri.$lang/ $uri/ =404;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_param PATH_INFO       $path_info;
    fastcgi_param HTTPS           $fastcgi_https if_not_empty;
    # The backend host must pass through an nginx variable: a literal host in
    # fastcgi_pass is resolved at config-parse time and aborts startup when no
    # php-fpm service exists in the stack. The variable defers resolution to
    # request time (via the resolver above), keeping php-fpm optional.
    resolver        127.0.0.11:53 valid=30s;
    set             $cgi_upstream ${PHP_FPM_HOST};
    fastcgi_pass    $cgi_upstream:${PHP_FPM_PORT};
    fastcgi_intercept_errors off;
    fastcgi_request_buffering off;
 }

  # Static assets with long cache: a missing asset must return 404, never the
  # app shell or the PHP front controller (otherwise broken SPA builds stay hidden).
  location ~ \.(?:css|js|mjs|map|svg|gif|png|jpg|ico|otf|woff2?)$ {
    root ${ROOT};
    try_files $uri =404;
    expires 6M;
    access_log off;
  }

  # Universal handling for static files, SPA/PWA, PHP and *.XX.* language variants.
  # try_files checks every entry but the last as a file on disk; only the last is a
  # fallback URI. Everything that exists on disk is delivered here; what matches
  # nothing goes to @fallback below.
  location / {
    root ${ROOT};
    try_files $uri.$lang.html $uri.html $uri $uri.$lang/ $uri/ @fallback;
  }

  # Nothing on disk matches — the answer is decided here, in this order:
  #   SPA_FALLBACK=no     404, the setting for a static website, where a
  #                       mistyped address must not answer 200 with the start
  #                       page. Only the literal value "no" switches the app
  #                       shell fallback off, so an unset or misspelled
  #                       variable never changes a running deployment.
  #   index.php exists    the PHP front controller answers (WordPress
  #                       permalinks and every other routed PHP application).
  #                       It decides per path and answers 404 for an address
  #                       it does not know, while a static shell answers every
  #                       address with the same page and status 200. Every
  #                       image built on this one carries the welcome page
  #                       index.html in ${ROOT}, so the shell must never win
  #                       over the front controller.
  #   otherwise           the language app shell, then the plain one, so deep
  #                       links and reloads of a client side routed app reach
  #                       the app; 404 where there is no shell either, and
  #                       php-fpm is never asked.
  # The front controller is entered with an internal redirect: as a try_files
  # entry it would be probed as a file on disk and then delivered from this
  # location, which has no FastCGI handler and would hand out the PHP source.
  location @fallback {
    root ${ROOT};
    set $spa_fallback "${SPA_FALLBACK}";
    if ($spa_fallback = "no") {
      return 404;
    }
    if (-f $document_root/index.php) {
      rewrite ^ /index.php last;
    }
    try_files /index.$lang.html /index.html =404;
  }
