# TLS policy for derived images that terminate TLS (this image's default
# server is plain HTTP behind a TLS-terminating proxy).
# Based on the Mozilla SSL Configuration Generator, "intermediate" profile.
ssl_protocols TLSv1.3 TLSv1.2;
# intermediate profile: let the client pick the best AEAD suite it supports
ssl_prefer_server_ciphers off;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305';
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;
# no OCSP stapling: it silently requires a resolver, and Let's Encrypt has
# ended OCSP support — certificate revocation is handled by short lifetimes
ssl_dhparam /etc/nginx/dhparam.pem;

# NOTE on security headers: they live in server.d/default.conf, NOT here.
# nginx add_header inheritance is all-or-nothing — any server block that sets
# its own add_header would silently drop http-level headers defined in this
# file, so the server block must carry the complete set itself (pinned by
# tests/e2e/test_headers.py). TLS-terminating derived images add
# Strict-Transport-Security in their own server blocks.
