# Derive the 2-letter language code from Accept-Language (de, en, fr, it, es, ...).
# Non-existent *.XX.* variants simply fall through in try_files to the default, so
# any language works without listing it explicitly.
map $http_accept_language $lang {
    default                en;
    "~*^(?<l>[a-z]{2})"    $l;
}

# Derive $fastcgi_https from native TLS ($https == "on") or X-Forwarded-Proto proxy header.
# The combined key "$https:$http_x_forwarded_proto" keeps the two signals independent so that
# native HTTPS always wins and an attacker-supplied X-Forwarded-Proto: http cannot downgrade it.
map "$https:$http_x_forwarded_proto" $fastcgi_https {
    "on:"      on;
    "on:http"  on;
    "on:https" on;
    ":https"   on;
    default    "";
}
