# E2E stack: one nginx service per supported usage, all built from the same
# image without any extra configuration, plus a pytest test-runner.
#   static  -> plain local file serving
#   spa     -> single page app / PWA (client side routing)
#   lang    -> *.XX.* language variant selection
#   bare    -> no index.html, no index.php: unknown routes must answer 404
#   deadphp -> PHP file exists, backend port closed: must answer 502 page
#   rooted  -> ROOT env override: serves from a subdirectory of the volume
#   fallback-yes / fallback-no
#           -> SPA_FALLBACK setting: same files, unknown path answers the
#              start page in one and 404 in the other
#   frontcontroller / frontcontroller-nofallback
#           -> index.php and index.html in the same root: the front
#              controller decides, the shell never answers an unknown path
#
# INVARIANT: this stack contains NO php-fpm service, so the default FastCGI
# backend hostname is not resolvable. Every service must still start and
# serve — PHP forwarding is optional and only used when a PHP file exists.
# The nginx+php-fpm combination is tested in the php-fpm project instead.
# distinct project name: both this and the php-fpm e2e stack live in a
# directory called e2e — without an explicit name they would collide
name: nginx-e2e

x-nginx: &nginx
  image: mwaeckerlin/nginx
  build:
    context: ../..

services:

  static:
    <<: *nginx
    volumes:
      - ./apps/static:/app:ro

  spa:
    <<: *nginx
    volumes:
      - ./apps/spa:/app:ro

  lang:
    <<: *nginx
    volumes:
      - ./apps/lang:/app:ro

  bare:
    <<: *nginx
    volumes:
      - ./apps/bare:/app:ro

  # backend host resolves (the static service) but its port 9000 is closed:
  # a PHP request must yield the 502 maintenance page, never kill the server
  deadphp:
    <<: *nginx
    environment:
      PHP_FPM_HOST: static
    volumes:
      - ./apps/deadphp:/app:ro

  # SPA_FALLBACK=yes (explicit): an unknown path serves the app shell,
  # exactly like the default service above
  fallback-yes:
    <<: *nginx
    environment:
      SPA_FALLBACK: "yes"
    volumes:
      - ./apps/static:/app:ro

  # SPA_FALLBACK=no: the same files, but an unknown path must answer 404 —
  # the setting for a static website
  fallback-no:
    <<: *nginx
    environment:
      SPA_FALLBACK: "no"
    volumes:
      - ./apps/static:/app:ro

  # index.php AND index.html in the root, the case of every PHP application
  # built on this image: the front controller must decide every unknown path.
  # The backend host resolves (the static service) with its port closed, so a
  # request that reaches the front controller ends in the 502 page.
  frontcontroller:
    <<: *nginx
    environment:
      PHP_FPM_HOST: static
    volumes:
      - ./apps/frontcontroller:/app:ro

  # the same application with the app shell fallback switched off
  frontcontroller-nofallback:
    <<: *nginx
    environment:
      PHP_FPM_HOST: static
      SPA_FALLBACK: "no"
    volumes:
      - ./apps/frontcontroller:/app:ro

  # ROOT override pins the environment variable substitution at startup
  rooted:
    <<: *nginx
    environment:
      ROOT: /app/sub
    volumes:
      - ./apps/static:/app:ro

  test-runner:
    build:
      context: .
    depends_on:
      - static
      - spa
      - lang
      - bare
      - deadphp
      - fallback-yes
      - fallback-no
      - frontcontroller
      - frontcontroller-nofallback
      - rooted
    environment:
      STATIC_URL:       http://static:8080
      SPA_URL:          http://spa:8080
      LANG_URL:         http://lang:8080
      BARE_URL:         http://bare:8080
      DEADPHP_URL:      http://deadphp:8080
      FALLBACK_YES_URL: http://fallback-yes:8080
      FALLBACK_NO_URL:  http://fallback-no:8080
      FC_URL:           http://frontcontroller:8080
      FC_NOFALLBACK_URL: http://frontcontroller-nofallback:8080
      ROOTED_URL:       http://rooted:8080
    command: ["pytest", "-v", "--tb=short"]
